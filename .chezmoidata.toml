editor = "vi"
history_size = 32768
autostart_ssh_agent = false

history_ignore = ["claude", "codex", "copilot", "gh copilot"]

default_hostname = "void(0)"

tree_ignore = ".git|node_modules|.DS_Store|dist|build|target|__pycache__|.venv|.next|.nuxt|.svelte-kit|.gradle|coverage"

dock_apps = [
  "Zen",
  "Zed",
  "Notion",
  "Visual Studio Code",
  "Discord",
  "GitKraken",
]

trash_skip = ["node_modules"]

keychain_name = "dotfiles"
keychain_lookup_field = "name"

# Rendered into both permissions.deny and the block-path-access.sh hook.
#
# Prefer a bare name, which matches at any depth and so still covers a symlink's
# target. A dot closes a path component without opening one, so a name covers
# its dotted variants but not longer words that start with it.
#
# An entry with a slash is a literal path, so write it absolute or ~-rooted: the
# deny layer anchors a relative path to the working directory, while the hook
# matches anywhere.
#
# No glob characters: the hook matches literally, and the deny rules read a
# wildcard.
claude_blocked_paths = [
  # The iCloud backup directory, whose tokens file holds every secret in
  # cleartext
  ".keychain",
  ".ssh",
  ".gnupg",
  ".aws",
  ".kube",
  ".env",
]
