# Plain, not .tmpl, so chezmoi symlinks it and `mise use -g` edits the tracked
# file

[tools]

# Every language with idiomatic version files enabled below needs a baseline
# here. A tool with no version installed gets no shim, so a project pin falls
# through to the system.
node = "lts"
java = "lts"
python = "latest"
ruby = "latest"
bun = "latest"
pnpm = "latest"

# `npm:` is spelled out where the registry has no entry (skilld) or maps the
# name to another tool (`cf` is Cloud Foundry there)
claude-code = "latest"
codex = "latest"
copilot = "latest"
gemini-cli = "latest"
ni = "latest"
"npm:@angular/cli" = "latest"
"npm:@nestjs/cli" = "latest"
"npm:@nuxt/cli" = "latest"
"npm:cf" = "latest"
"npm:npm-check-updates" = "latest"
"npm:skilld" = "latest"

[settings]

idiomatic_version_file_enable_tools = ["node", "python", "ruby", "java"]

# A package.json `devEngines.runtime` pin would otherwise take over repos that
# never opted into mise
idiomatic_version_file_disable_files = ["node:package.json"]

# Homebrew's node stays installed as a dependency, so the fallback would quietly
# run the wrong major. mise's docs suggest pairing this with
# not_found_auto_install = false, but `mise activate` then drops the shims
# directory from PATH.
not_found_system_fallback = false

# The default stays quiet for a tool with no version installed at all
status.missing_tools = "always"

# Oracle stops updating each line after six months, which silently freezes
# `java = "lts"` on an unpatched build. Adoptium can still respin a build at one
# patch level, and mise's semver compare ignores what follows the plus, so
# `mise upgrade` holds the older one. `mise latest java@lts` against
# `mise current java` shows the gap, and uninstalling the stale build moves
# `lts` forward.
java.shorthand_vendor = "temurin"
